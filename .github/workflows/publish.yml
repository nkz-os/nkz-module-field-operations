name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/nkz-os/nkz-module-field-operations:latest
            ghcr.io/nkz-os/nkz-module-field-operations:${{ github.sha }}

  publish-module:
    needs: build-and-push
    uses: nkz-os/nkz/.github/workflows/_publish-module.yml@main
    with:
      module_id: field-operations
    secrets:
      INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
